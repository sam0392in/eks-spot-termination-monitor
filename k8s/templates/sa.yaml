{{- if and .Values.serviceAccount.enabled (not .Values.canary.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  annotations:
    {{ toYaml .Values.serviceAccount.annotations }}
  labels:
    {{- include "eks-spot-termination-monitor.commonLabels" . | nindent 4 }}
{{- end }}