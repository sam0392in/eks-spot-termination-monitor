apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "eks-spot-termination-monitor.commonLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "serviceaccounts", "ingresses", "namespaces"]
    verbs: ["get", "list"]

  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "update", "patch"]
